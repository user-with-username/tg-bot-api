name: Generate schema

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 'master'
      - name: Install toolchain
        run: rustup default stable
      - name: Generate schema
        run: cargo run --bin generate_schema --features schema-gen
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add schema
          git diff --staged --quiet || git commit -m "Update schema"
          git push
